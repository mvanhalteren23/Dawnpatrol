name: Android app

# Builds the Head Above CRM Android app (a Trusted Web Activity around /crm).
# - Run it by hand with "create_signing_key" ticked ONCE to make the release signing key.
# - After that, every push to main that changes android/ (or a manual run) builds a signed APK + AAB.

on:
  workflow_dispatch:
    inputs:
      create_signing_key:
        description: "Create a new signing key (first time only)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  signing-key:
    if: github.event_name == 'workflow_dispatch' && inputs.create_signing_key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Create keystore
        env:
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEY_PASSWORD" ]; then echo "::error::Add the repository secret ANDROID_KEYSTORE_PASSWORD first (any long random password), then run again."; exit 1; fi
          mkdir out
          keytool -genkeypair -v -keystore out/headabove-release.jks -alias headabove -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=Head Above Digital, O=Luna VR Inc., L=Squamish, ST=BC, C=CA"
          base64 -w0 out/headabove-release.jks > out/ANDROID_KEYSTORE_BASE64.txt
          keytool -list -v -keystore out/headabove-release.jks -alias headabove -storepass "$KEY_PASSWORD" | grep "SHA256:" | sed 's/.*SHA256: //' > out/ANDROID_CERT_SHA256.txt
          echo "SHA-256 fingerprint (put this in Vercel as ANDROID_CERT_SHA256):"
          cat out/ANDROID_CERT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-key-DOWNLOAD-AND-DELETE
          path: out/
          retention-days: 1

  build:
    if: github.event_name == 'push' || !inputs.create_signing_key
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building with a throwaway debug key. The app will install but shows an address bar, and updates won't install over it later."
          fi
      - name: Build APK and app bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: headabove
        run: ./gradlew --no-daemon assembleRelease bundleRelease -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: head-above-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
