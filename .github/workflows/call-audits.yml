# The daytime sweep, every 30 minutes (14:00-04:59 UTC, about 7am-9pm Pacific). Vercel's Hobby plan
# only runs crons once a day, so this pings /api/cron/audits, which:
#   - places due call-audit calls and writes audit reports,
#   - texts appointment reminders and review requests that are due,
#   - calls owners whose weekly check-in is due (weekdays 10am-4pm their time),
# and pings /api/cron/campaigns, which checks campaign replies and bounces and sends the next
# few campaign emails (inside each campaign's sending hours).
# Keep it enabled: reminders and check-ins depend on it. (On Vercel Pro, move this to a vercel.json
# cron and delete this workflow.)
# Needs two repository secrets: APP_URL (e.g. https://your-app.vercel.app) and CRON_SECRET
# (the same value as the Vercel env var).
name: Daytime sweep (audits, reminders, check-ins)
on:
  schedule:
    - cron: "*/30 14-23 * * *"
    - cron: "*/30 0-4 * * *"
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run the sweep
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "::warning::Set the APP_URL and CRON_SECRET repository secrets"; exit 0; fi
          status=0
          curl -fsS -m 120 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/audits" || status=1
          curl -fsS -m 170 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/campaigns" || status=1
          exit $status
