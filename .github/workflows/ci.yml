# Checks every push and pull request: type-check and the unit tests. (Vercel builds each branch
# itself: a preview for work branches, the live site for the production branch.)
name: CI
on:
  push:
    branches-ignore: ["dependabot/**"] # their pull requests are checked below; once is enough
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
